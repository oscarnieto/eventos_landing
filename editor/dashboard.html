<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis eventos · Editor de Landings</title>
<link rel="stylesheet" href="css/editor.css">
</head>
<body>

<header class="topbar">
  <div class="topbar__brand">
    <img src="../assets/savills-logo.png" alt="Savills">
    <span id="app-name">Editor de Landings</span>
  </div>
  <div class="topbar__actions">
    <button class="btn btn--ghost btn--sm" id="logout">Cerrar sesión</button>
  </div>
</header>

<main class="wrap">
  <div class="dash__head">
    <h1>Mis eventos</h1>
    <button class="btn btn--primary" id="new-event">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Nuevo evento
    </button>
  </div>

  <div id="list"></div>
</main>

<!-- modal de confirmación -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <h3 id="modal-title">¿Eliminar evento?</h3>
    <p id="modal-text">Esta acción no se puede deshacer.</p>
    <div class="modal__actions">
      <button class="btn" id="modal-cancel">Cancelar</button>
      <button class="btn btn--danger" id="modal-ok">Eliminar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/db.js"></script>
<script src="libs/jszip.min.js"></script>
<script src="../event-config.js"></script>
<script src="js/export.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
