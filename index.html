<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Impulso y oportunidad | Savills</title>
  <meta name="description" content="Únete a Savills en una jornada sobre el futuro de las oficinas." />
  <meta name="robots" content="index,follow" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Impulso y oportunidad | Savills" />
  <meta property="og:description" content="El encuentro de referencia sobre el futuro del espacio de trabajo." />

  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&family=Montserrat:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <!-- ===================== HERO (incluye top bar + menú) ===================== -->
  <header class="hero" id="top" data-region="hero">
    <div class="hero__bar">
      <a class="logo" href="#top" data-bind="brand.logoText" aria-label="Savills">savills</a>
      <a class="btn btn--solid hero__register" data-region="nav-cta" href="#registro">Registro</a>
    </div>

    <div class="hero__center">
      <span class="hero__logo logo" data-bind="brand.logoText">savills</span>
      <p class="hero__overline" data-bind="hero.overline">OFICINAS</p>
      <h1 class="hero__title" data-bind="hero.title">Impulso y oportunidad</h1>
      <nav class="hero__nav" aria-label="Navegación principal">
        <ul class="hero__nav-list" data-region="nav-links"></ul>
      </nav>
    </div>
  </header>

  <main>
    <!-- ===================== INFO (cuenta atrás + descripción + highlights) ===================== -->
    <section class="section info" id="info">
      <div class="container">
        <div class="countdown" data-region="countdown" aria-live="polite"></div>

        <div class="info__intro">
          <h2 class="block-title" data-bind="event.name">Nombre del evento</h2>
          <p class="info__desc" data-bind="event.description"></p>
        </div>

        <div class="highlights-bar" data-region="highlights"></div>
      </div>
    </section>

    <!-- ===================== AGENDA ===================== -->
    <section class="section agenda" id="agenda">
      <div class="container">
        <h2 class="block-title" data-bind="agenda.title">Agenda</h2>
        <div class="agenda__grid" data-region="agenda"></div>
      </div>
    </section>

    <!-- ===================== AÑADIR AL CALENDARIO ===================== -->
    <section class="section calendar" id="calendario">
      <div class="container">
        <h2 class="block-title" data-bind="calendar.title">Añadir al calendario</h2>
        <div class="calendar__btns" data-region="calendar"></div>
      </div>
    </section>

    <!-- ===================== PONENTES ===================== -->
    <section class="section speakers" id="ponentes">
      <div class="container">
        <h2 class="block-title" data-bind="speakers.title">Ponentes</h2>
        <div class="speakers__grid" data-region="speakers"></div>
      </div>
    </section>

    <!-- ===================== REGISTRO ===================== -->
    <section class="section registro" id="registro">
      <div class="container">
        <p class="block-overline" data-bind="registration.title">Registro</p>
        <h2 class="block-title" data-bind="registration.subtitle">Formulario de registro</h2>
        <p class="block-intro" data-bind="registration.intro"></p>
        <div class="registro__formwrap">
          <form class="form" id="registerForm" novalidate data-region="form"></form>
          <div class="form__success" id="formSuccess" role="status" hidden></div>
        </div>
      </div>
    </section>
  </main>

  <!-- ===================== FOOTER (amarillo) ===================== -->
  <footer class="footer" data-region="footer">
    <div class="container footer__inner">
      <div class="footer__left">
        <span class="footer__logo" data-bind="footer.logoText">savills</span>
        <p class="footer__copy" data-bind="footer.copyright"></p>
      </div>
      <div class="footer__right">
        <a class="footer__site" data-region="footer-site" href="#"></a>
        <ul class="social" data-region="social"></ul>
      </div>
    </div>
  </footer>

  <script src="assets/js/main.js" defer></script>
</body>
</html>
